# Two app instances behind a load balancer, sharing one PostgreSQL:
# the deployment shape the service has to be correct under.
name: bulk-payments

x-app: &app
  build: .
  image: bulk-payments:local
  environment:
    DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/bulk_payments

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bulk_payments
    ports:
      - "55433:5432" # off the default port, so a local Postgres doesn't clash
    healthcheck:
      # Over TCP: during first-time init Postgres runs a temporary server on the
      # Unix socket only, so a socket check can pass before clients can connect.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d bulk_payments"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Migrations run once, before any replica starts, so replicas never race on DDL.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
