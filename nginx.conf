upstream app {
    # Docker's DNS returns one address per replica of the "app" service;
    # nginx round-robins between them. The shared zone makes all nginx worker
    # processes share one round-robin position instead of each starting over.
    zone app 64k;
    server app:8000;
}

server {
    listen 80;

    # nginx's 1 MB default is below what the API accepts: 1000 payments with
    # descriptions of up to 1000 characters, which JSON may escape to 6 bytes each.
    client_max_body_size 8m;

    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx does not replay a failed POST on another replica (no
        # "non_idempotent" in proxy_next_upstream). Keep it that way: a POST that
        # timed out may already have committed. Clients retry with an
        # Idempotency-Key instead.

        # Shows which replica served the request (used by `make demo`).
        add_header X-Upstream $upstream_addr always;
    }
}
