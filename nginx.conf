upstream app {
    # Docker's DNS returns one address per replica of the "app" service;
    # nginx round-robins between them. The shared zone makes all nginx worker
    # processes share one round-robin position instead of each starting over.
    zone app 64k;
    server app:8000;
}

server {
    listen 80;

    # nginx's 1 MB default is below what the API accepts: 1000 payments with
    # descriptions of up to 1000 characters. JSON may escape a character to 12
    # bytes (an emoji becomes a surrogate pair), so the largest valid request is
    # about 11.5 MiB.
    client_max_body_size 16m;

    location / {
        proxy_pass http://app;
        # $http_host keeps the port, so redirects the app issues point back at :8080.
        proxy_set_header Host $http_host;
        # nginx is the edge: overwrite, don't append to, what the client sent, or it could spoof its IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx does not replay a failed POST on another replica (no
        # "non_idempotent" in proxy_next_upstream). Keep it that way: a POST that
        # timed out may already have committed. Clients retry with an
        # Idempotency-Key instead.

        # Shows which replica served the request, for `make demo` and `make load`.
        # Local demo only: in production this would expose internal addresses.
        add_header X-Upstream $upstream_addr always;
    }
}
