name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit SHA. Tags can be moved, and setup-uv stopped
# publishing major-version tags, so a ref like @v10 doesn't resolve. The runner
# image is pinned too, so a GitHub image migration can't change CI unannounced.
jobs:
  checks:
    name: Verification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # One cache per job: two jobs saving the same key at once made one save fail.
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      # The same gate that has to pass locally before a commit: lint, types,
      # migrations and every test. Integration tests start their own PostgreSQL
      # through testcontainers.
      - name: make check
        run: make check

  stack:
    name: Two replicas behind nginx, raced
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # One cache per job: two jobs saving the same key at once made one save fail.
          cache-suffix: ${{ github.job }}
      - run: uv sync --frozen
      - run: docker compose up --build --detach --wait
      - run: make seed
      - name: Sample request returns 201
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/bulk_payments \
            -H 'Content-Type: application/json' -d @scripts/sample_request.json)
          test "$code" = 201
      - name: Race demo
        run: uv run python scripts/race_demo.py
      - name: Logs on failure
        if: failure()
        run: docker compose logs
