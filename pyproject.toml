[project]
name = "bulk-payments"
version = "0.1.0"
description = "Bulk payment service: one firm pays many firms from its platform balance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_payments"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bulk_payments"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real PostgreSQL (testcontainers, or TEST_DATABASE_URL)"]
filterwarnings = [
    # Starlette's TestClient now prefers httpx2; httpx still works and is what we pin.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
