[project]
name = "bulk-payments"
version = "1.0.0"
description = "Bulk payment service: one firm pays many firms from its platform balance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "fastapi>=0.141",
    "psycopg[binary]>=3.3",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_payments"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bulk_payments"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs a real PostgreSQL (testcontainers, or TEST_DATABASE_URL)"]
filterwarnings = [
    # Starlette's TestClient now prefers httpx2; httpx still works and is what we pin.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
